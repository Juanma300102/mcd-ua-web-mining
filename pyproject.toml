[project]
name = "news-politica"
version = "0.1.0"
description = "Scraping and sentiment analysis of Argentine political news (Infobae, La Nación, MisionesOnline)."
requires-python = ">=3.11,<3.15"
dependencies = [
    "dagster==1.13.27",
    "dagster-postgres>=0.29.27",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "dagster-webserver==1.13.27",
    "dagster-dg-cli==1.13.27",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_politica"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "news_politica"
registry_modules = [
    "news_politica.components.*",
]
