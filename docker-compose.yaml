name: news-politica
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dagster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dagster}
      POSTGRES_DB: ${POSTGRES_DB:-dagster}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5434}:5432"
    volumes:
      - news_politica_dagster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h localhost: on a fresh volume the init server only listens on the Unix
      # socket, so a socket check reports ready before TCP connections work.
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Local LLM for the GPU alternative sentiment model (qwen2.5-7b). Behind the
  # `ollama` profile so `docker compose up` (and scripts/dagster-up.sh) keep
  # starting only Postgres: the GPU reservation fails on machines without an
  # NVIDIA GPU. Start it with `docker compose --profile ollama up -d --wait`.
  ollama:
    image: ollama/ollama:0.24.0
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PUBLISH_PORT:-11434}:11434"
    volumes:
      - news_politica_ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  news_politica_dagster_postgres_data:
  news_politica_ollama_models:
