# One block configures run, schedule and event-log storage.
# scheme pins psycopg2: with psycopg 3 (SQLAlchemy 2.1's default for postgresql://)
# dagster-webserver fails its first query with "the connection is closed".
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_POSTGRES_HOST
      port:
        env: DAGSTER_POSTGRES_PORT
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      scheme: postgresql+psycopg2
