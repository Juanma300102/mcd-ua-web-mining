# One block configures run, schedule and event-log storage.
# scheme pins the psycopg 3 driver instead of relying on SQLAlchemy's default.
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_POSTGRES_HOST
      port:
        env: DAGSTER_POSTGRES_PORT
      username:
        env: DAGSTER_POSTGRES_USER
      password:
        env: DAGSTER_POSTGRES_PASSWORD
      db_name:
        env: DAGSTER_POSTGRES_DB
      scheme: postgresql+psycopg
